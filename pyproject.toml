[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fontfixer"
version = "1.5.1"
description = "Simple OpenType tidy-up (OS/2, style, glyphs, kern) in a single pass"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fonttools>=4.0.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/andrewsipe/FontFixer"
Documentation = "https://andrewsipe.github.io/FontFixer/"
Repository = "https://github.com/andrewsipe/FontFixer"

[project.scripts]
fontfixer = "FontFixer.main:main"

[tool.setuptools]
packages = ["FontFixer", "FontFixer.support", "FontFixer.support.handlers", "FontCore"]

[tool.setuptools.package-dir]
"FontFixer" = "."
"FontCore" = "FontCore"

[tool.fontcore-vendor]
modules = ["core_console_config", "core_console_styles", "core_file_collector", "core_logging_config", "core_run_report"]

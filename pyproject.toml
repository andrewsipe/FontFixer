[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fontfixer"
version = "1.0.0"
description = "Modular font validation and correction tool (OpenType fixes in a single pass)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fonttools>=4.0.0",
    "rich>=13.0.0",
]

[project.scripts]
fontfixer = "FontFixer.main:main"
FontFixer = "FontFixer.main:main"

[tool.setuptools]
packages = ["FontFixer", "FontFixer.support", "FontFixer.support.handlers"]

[tool.setuptools.package-dir]
"FontFixer" = "."

[tool.setuptools.package-data]
"FontFixer" = ["support/**/*.py", "support/handlers/**/*.py"]
